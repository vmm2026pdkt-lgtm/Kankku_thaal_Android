name: Android Build

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The project ships without a committed gradle-wrapper.jar (binary files
      # can't be produced in this environment). This step installs Gradle
      # directly so CI doesn't depend on the wrapper being present. Android
      # Studio will regenerate gradlew/gradle-wrapper.jar automatically the
      # first time the project is opened locally.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # Optional release signing. Only runs if all four secrets are configured
      # in the repo (Settings -> Secrets and variables -> Actions). Without
      # them, assembleRelease still succeeds, signed with the debug key, so
      # CI never breaks for lack of a production keystore.
      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Build release AAB (Play Store bundle)
        run: gradle bundleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kanakku-thaal-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kanakku-thaal-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: kanakku-thaal-release-aab
          path: app/build/outputs/bundle/release/*.aab
